# conda env create -f environment.yml && conda activate rock_climbing
#
# HDR clips need a Vulkan device for libplacebo to tone-map on. On macOS that
# is `conda install -c conda-forge moltenvk`; elsewhere it is the system's own
# driver. SDR clips need neither.
name: rock_climbing
channels:
  - conda-forge
dependencies:
  - python=3.11
  - ffmpeg
  - py-opencv          # SIFT + USAC_MAGSAC: the camera track rests on both
  - numpy
  - scipy             # mask cleanup, the route spline, keypoint smoothing
  - matplotlib-base
  - pillow
  - rich
  - python-dotenv
  - pip
  - pip:
      - openai>=1.40
